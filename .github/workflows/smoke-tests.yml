name: Smoke Tests

on:
  pull_request:
    branches: [ "main", "staging" ]

permissions: read-all

jobs:
  build-and-test:
    name: "Build & Test"
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: darwin
            arch: amd64
            runner: macos-latest
          - os: windows
            arch: amd64
            runner: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          check-latest: true

      - name: Build ${{ matrix.os }}/${{ matrix.arch }}
        shell: bash
        run: |
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -o witr-${{ matrix.os }}-${{ matrix.arch }} ./cmd/witr
          chmod +x witr-${{ matrix.os }}-${{ matrix.arch }}

      - name: Verify Version
        shell: bash
        run: ./witr-${{ matrix.os }}-${{ matrix.arch }} --version

      - name: Verify Help
        shell: bash
        run: ./witr-${{ matrix.os }}-${{ matrix.arch }} --help

  build-loong64:
    name: "Build: linux/loong64 (LoongArch)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          check-latest: true

      # GitHub-hosted runners are x86_64/arm64, so a loong64 binary cannot be
      # executed directly. Cross-compile and verify the artifact instead.
      - name: Cross-compile for LoongArch
        shell: bash
        run: |
          GOOS=linux GOARCH=loong64 CGO_ENABLED=0 go build -o witr-linux-loong64 ./cmd/witr
          test -s witr-linux-loong64
          go version -m witr-linux-loong64 | head -5

  test-freebsd:
    name: "Test: FreeBSD"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y go
          run: |
            go build -o witr-freebsd-amd64 ./cmd/witr
            chmod +x witr-freebsd-amd64
            ./witr-freebsd-amd64 --version
            ./witr-freebsd-amd64 --help
            go test ./...
